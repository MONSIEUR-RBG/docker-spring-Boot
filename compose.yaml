services:
  postgres:
    image: 'postgres:latest'
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - spring-postgres
    environment:
      - POSTGRES_DB=students_db
      - POSTGRES_PASSWORD_FILE=jeSuisCharlie@
      - POSTGRES_USER=abel
    ports:
      - '5432:5432'
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=eyramrizbangou@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=?rbg200%
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - spring-postgres
volumes:
  db-data:
  pgadmin-data:
secrets:
  db-password:
    file: db/password.txt
networks:
  spring-postgres:
